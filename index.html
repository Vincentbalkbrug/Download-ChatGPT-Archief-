<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Mijn ChatGPT Bibliotheek</title>
  <style>
    :root{
      --bg:#f5f6f8;--card:#fff;--text:#17181a;--muted:#6b7280;
      --border:#e5e7eb;--accent:#111827;--danger:#b42318;--shadow:0 2px 10px rgba(0,0,0,.06)
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    body{min-height:100vh}
    button,input{font:inherit}
    button{cursor:pointer}
    .app{width:100%;max-width:760px;margin:0 auto;padding:16px 14px calc(32px + env(safe-area-inset-bottom))}
    header{position:sticky;top:0;z-index:10;background:rgba(245,246,248,.96);backdrop-filter:blur(10px);padding:8px 0 12px}
    h1{font-size:25px;margin:4px 0 12px}
    .search{width:100%;border:1px solid var(--border);background:#fff;border-radius:14px;padding:13px 14px;outline:none;font-size:16px}
    .toolbar{display:flex;gap:10px;margin:12px 0}
    .btn{border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:#fff;font-weight:600}
    .btn.secondary{background:#fff;color:var(--text);border:1px solid var(--border)}
    .btn.danger{background:#fff;color:var(--danger);border:1px solid #f2c9c5}
    .topics{display:grid;gap:12px}
    .topic{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
    .topic-head{display:flex;align-items:center;gap:10px;padding:14px}
    .topic-open{flex:1;border:0;background:transparent;text-align:left;padding:0;font-size:17px;font-weight:700;color:var(--text)}
    .count{font-size:13px;color:var(--muted);font-weight:500}
    .iconbtn{border:0;background:transparent;padding:7px;border-radius:9px;font-size:18px}
    .iconbtn:hover{background:#f3f4f6}
    .topic-body{display:none;border-top:1px solid var(--border);padding:10px}
    .topic.open .topic-body{display:block}
    .chat{display:flex;align-items:center;gap:9px;border-bottom:1px solid #f0f1f3;padding:10px 4px}
    .chat:last-child{border-bottom:0}
    .chat-link{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:4px 2px;color:var(--text)}
    .chat-title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .chat-url{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
    .empty{padding:18px;text-align:center;color:var(--muted)}
    .addchat{width:100%;margin-top:8px}
    dialog{border:0;border-radius:18px;width:min(92vw,480px);padding:0;box-shadow:0 20px 60px rgba(0,0,0,.25)}
    dialog::backdrop{background:rgba(0,0,0,.35)}
    .modal{padding:18px}
    .modal h2{margin:0 0 14px;font-size:20px}
    label{display:block;font-size:13px;font-weight:650;margin:12px 0 6px}
    input[type=text],input[type=url]{width:100%;padding:12px;border:1px solid var(--border);border-radius:11px;font-size:16px}
    .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
    .hint{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.4}
    @media (max-width:430px){
      .app{padding-left:10px;padding-right:10px}
      h1{font-size:22px}
      .toolbar{display:grid;grid-template-columns:1fr 1fr}
      .btn{padding:11px 10px}
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>Mijn ChatGPT Bibliotheek</h1>
    <input id="search" class="search" type="search" placeholder="Zoek onderwerp of opgeslagen chat…" autocomplete="off" />
    <div class="toolbar">
      <button class="btn" id="addTopicBtn">+ Onderwerp</button>
      <button class="btn secondary" id="backupBtn">Back-up</button>
    </div>
  </header>
  <main id="topics" class="topics"></main>
</div>

<dialog id="topicDialog">
  <form class="modal" id="topicForm">
    <h2>Nieuw onderwerp</h2>
    <label for="topicName">Naam</label>
    <input id="topicName" type="text" maxlength="60" placeholder="Bijv. Recepten" required />
    <div class="modal-actions">
      <button type="button" class="btn secondary" data-close="topicDialog">Annuleren</button>
      <button type="submit" class="btn">Opslaan</button>
    </div>
  </form>
</dialog>

<dialog id="chatDialog">
  <form class="modal" id="chatForm">
    <h2>ChatGPT-link toevoegen</h2>
    <input id="chatTopicId" type="hidden" />
    <label for="chatTitle">Titel</label>
    <input id="chatTitle" type="text" maxlength="100" placeholder="Bijv. Pannenkoeken recept" required />
    <label for="chatUrl">ChatGPT-link</label>
    <input id="chatUrl" type="url" inputmode="url" placeholder="https://chatgpt.com/share/..." required />
    <div class="hint">Plak hier de gedeelde ChatGPT-link. Als je erop tikt, opent de chat in een nieuw venster.</div>
    <div class="modal-actions">
      <button type="button" class="btn secondary" data-close="chatDialog">Annuleren</button>
      <button type="submit" class="btn">Opslaan</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  const STORAGE_KEY = "chatgpt_bibliotheek_v3";

  const $ = (sel) => document.querySelector(sel);
  const topicsEl = $("#topics");
  const searchEl = $("#search");
  const topicDialog = $("#topicDialog");
  const chatDialog = $("#chatDialog");

  let data = loadData();

  function uid() {
    return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  }

  function loadData() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved && Array.isArray(saved.topics)) return saved;
    } catch(e) {}
    return {
      topics: [
        { id: uid(), name: "Recepten", open: true, chats: [] },
        { id: uid(), name: "Apps & ideeën", open: false, chats: [] }
      ]
    };
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function esc(s="") {
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[c]));
  }

  function normalizeUrl(value) {
    let url = value.trim();
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    return url;
  }

  function render() {
    const q = searchEl.value.trim().toLowerCase();
    const filtered = data.topics.map(t => {
      if (!q) return t;
      const topicMatch = t.name.toLowerCase().includes(q);
      const chats = t.chats.filter(c =>
        c.title.toLowerCase().includes(q) || c.url.toLowerCase().includes(q)
      );
      return topicMatch ? t : {...t, chats};
    }).filter(t => !q || t.name.toLowerCase().includes(q) || t.chats.length);

    if (!filtered.length) {
      topicsEl.innerHTML = '<div class="empty">Geen resultaten gevonden.</div>';
      return;
    }

    topicsEl.innerHTML = filtered.map(t => `
      <section class="topic ${(t.open || q) ? "open" : ""}" data-topic="${esc(t.id)}">
        <div class="topic-head">
          <button class="topic-open" type="button" data-action="toggle" data-id="${esc(t.id)}">
            ${esc(t.name)} <span class="count">(${t.chats.length})</span>
          </button>
          <button class="iconbtn" type="button" aria-label="Chat toevoegen" title="Chat toevoegen" data-action="add-chat" data-id="${esc(t.id)}">＋</button>
          <button class="iconbtn" type="button" aria-label="Onderwerp verwijderen" title="Onderwerp verwijderen" data-action="delete-topic" data-id="${esc(t.id)}">🗑️</button>
        </div>
        <div class="topic-body">
          ${t.chats.length ? t.chats.map(c => `
            <div class="chat">
              <button class="chat-link" type="button" data-action="open-chat" data-topic-id="${esc(t.id)}" data-chat-id="${esc(c.id)}">
                <div class="chat-title">${esc(c.title)}</div>
                <div class="chat-url">${esc(c.url)}</div>
              </button>
              <button class="iconbtn" type="button" aria-label="Verwijderen" title="Verwijderen" data-action="delete-chat" data-topic-id="${esc(t.id)}" data-chat-id="${esc(c.id)}">🗑️</button>
            </div>`).join("") : '<div class="empty">Nog geen chats opgeslagen.</div>'}
          <button class="btn secondary addchat" type="button" data-action="add-chat" data-id="${esc(t.id)}">+ ChatGPT-link toevoegen</button>
        </div>
      </section>
    `).join("");
  }

  // BELANGRIJK: één centrale klikhandler voorkomt dat dynamisch toegevoegde items "dood" zijn.
  topicsEl.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;

    const action = btn.dataset.action;

    if (action === "toggle") {
      const t = data.topics.find(x => x.id === btn.dataset.id);
      if (!t) return;
      t.open = !t.open;
      saveData();
      render();
    }

    if (action === "add-chat") {
      $("#chatTopicId").value = btn.dataset.id;
      $("#chatTitle").value = "";
      $("#chatUrl").value = "";
      chatDialog.showModal();
      setTimeout(() => $("#chatTitle").focus(), 30);
    }

    if (action === "delete-topic") {
      const t = data.topics.find(x => x.id === btn.dataset.id);
      if (!t) return;
      if (confirm(`Onderwerp "${t.name}" verwijderen inclusief alle opgeslagen chats?`)) {
        data.topics = data.topics.filter(x => x.id !== t.id);
        saveData();
        render();
      }
    }

    if (action === "delete-chat") {
      const t = data.topics.find(x => x.id === btn.dataset.topicId);
      if (!t) return;
      const c = t.chats.find(x => x.id === btn.dataset.chatId);
      if (!c) return;
      if (confirm(`"${c.title}" verwijderen?`)) {
        t.chats = t.chats.filter(x => x.id !== c.id);
        saveData();
        render();
      }
    }

    if (action === "open-chat") {
      const t = data.topics.find(x => x.id === btn.dataset.topicId);
      const c = t?.chats.find(x => x.id === btn.dataset.chatId);
      if (!c) return;
      const url = normalizeUrl(c.url);

      // Op iPhone/Safari werkt een echte link/open call vanuit de klikactie het betrouwbaarst.
      const opened = window.open(url, "_blank", "noopener,noreferrer");
      if (!opened) window.location.href = url;
    }
  });

  $("#addTopicBtn").addEventListener("click", () => {
    $("#topicName").value = "";
    topicDialog.showModal();
    setTimeout(() => $("#topicName").focus(), 30);
  });

  $("#topicForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("#topicName").value.trim();
    if (!name) return;
    data.topics.unshift({ id: uid(), name, open: true, chats: [] });
    saveData();
    topicDialog.close();
    render();
  });

  $("#chatForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const topicId = $("#chatTopicId").value;
    const t = data.topics.find(x => x.id === topicId);
    if (!t) return;

    const title = $("#chatTitle").value.trim();
    const url = normalizeUrl($("#chatUrl").value);
    try { new URL(url); } catch {
      alert("Deze link lijkt niet geldig.");
      return;
    }

    t.chats.unshift({ id: uid(), title, url });
    t.open = true;
    saveData();
    chatDialog.close();
    render();
  });

  document.querySelectorAll("[data-close]").forEach(btn => {
    btn.addEventListener("click", () => document.getElementById(btn.dataset.close).close());
  });

  searchEl.addEventListener("input", render);

  $("#backupBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "chatgpt-bibliotheek-backup.json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  render();
})();
</script>
</body>
</html>
